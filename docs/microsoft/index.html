    <div class="app-shell" data-testid="cowork-app">
      <aside class="sidebar" aria-label="Copilot navigation">
        <header class="sidebar-header">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
          <strong>Copilot</strong>
          <div class="header-actions" aria-label="Sidebar controls">
            <button class="icon-button" data-action="apps-launcher" aria-label="Apps" aria-expanded="false"><svg class="fluent-icon"><use href="#icon-grid-dots"></use></svg></button>
            <button class="icon-button" data-view="tasks" aria-label="Open tasks"><svg class="fluent-icon"><use href="#icon-clipboard-task"></use></svg></button>
            <button class="icon-button" data-action="collapse-sidebar" aria-label="Collapse navigation"><svg class="fluent-icon"><use href="#icon-panel-contract"></use></svg></button>
          </div>
        </header>

        <div class="apps-launcher" id="apps-launcher" hidden>
          <header><strong>Microsoft 365</strong><button class="text-button" data-action="all-apps">All apps</button></header>
          <div class="apps-grid">
            <button data-action="launch-app"><span class="app-tile word">W</span><span>Word</span></button>
            <button data-action="launch-app"><span class="app-tile excel">X</span><span>Excel</span></button>
            <button data-action="launch-app"><span class="app-tile powerpoint">P</span><span>PowerPoint</span></button>
            <button data-action="launch-app"><span class="app-tile outlook">O</span><span>Outlook</span></button>
            <button data-action="launch-app"><span class="app-tile teams">T</span><span>Teams</span></button>
            <button data-action="launch-app"><span class="app-tile onedrive"><svg class="fluent-icon"><use href="#icon-cloud"></use></svg></span><span>OneDrive</span></button>
          </div>
        </div>

        <div class="mode-switch" role="tablist" aria-label="Copilot mode">
          <button role="tab" data-mode="chat" aria-selected="false">Chat</button>
          <button class="active" role="tab" data-mode="cowork" aria-selected="true">Cowork</button>
        </div>

        <nav class="primary-nav" id="primary-nav">
          <button class="nav-item active" data-view="home"><svg class="fluent-icon nav-icon"><use href="#icon-add-circle"></use></svg><span>New task</span></button>
          <button class="nav-item" data-view="tasks"><svg class="fluent-icon nav-icon"><use href="#icon-task-list"></use></svg><span>My tasks</span></button>
          <button class="nav-item" data-view="scheduled"><svg class="fluent-icon nav-icon"><use href="#icon-calendar-clock"></use></svg><span>Scheduled</span></button>
          <button class="nav-item" data-view="customize"><svg class="fluent-icon nav-icon"><use href="#icon-wand"></use></svg><span>Customize</span></button>
        </nav>

        <footer class="profile-row">
          <div class="avatar">EA</div>
          <div class="profile-copy"><strong>Elvia Atkins</strong><span>M365 Copilot Premium</span></div>
          <button class="icon-button" aria-label="Settings"><svg class="fluent-icon"><use href="#icon-settings"></use></svg></button>
        </footer>
      </aside>

      <main class="main-surface">
        <header class="topbar">
          <button class="model-button" id="model-button" aria-haspopup="menu" aria-expanded="false"><span data-model-label>Auto</span><svg class="fluent-icon chevron"><use href="#icon-chevron-down"></use></svg></button>
          <div class="topbar-spacer"></div>
          <button class="icon-button security" aria-label="Security status"><svg class="fluent-icon"><use href="#icon-shield-check"></use></svg></button>
          <button class="icon-button demo-control" id="open-studio" title="Open demo controls (Alt+D)" aria-label="Open demo controls"><svg class="fluent-icon"><use href="#icon-sparkle-circle"></use></svg></button>
        </header>

        <section class="home-view" id="workspace" aria-labelledby="welcome-heading">
          <div class="home-content">
            <h1 id="welcome-heading">Hi <span data-user-first-name>Elvia</span>, how can I help?</h1>
            <form class="composer" id="task-composer" data-testid="task-composer">
              <button type="button" class="composer-icon" aria-label="Add attachments"><svg class="fluent-icon"><use href="#icon-add"></use></svg></button>
              <input id="task-input" aria-label="Task request" placeholder="Start a task" autocomplete="off" />
              <button type="button" class="composer-icon" aria-label="Use voice input"><svg class="fluent-icon"><use href="#icon-mic"></use></svg></button>
            </form>

            <div class="suggestions-heading"><strong>Try these next</strong><button>Show more</button></div>
            <div class="suggestion-grid" aria-label="Suggested tasks">
              <button class="suggestion-card" data-prompt="Organize my inbox and flag anything that needs my reply."><span class="suggestion-icon inbox"><svg class="fluent-icon"><use href="#icon-mail"></use></svg></span><span>Organize my inbox</span></button>
              <button class="suggestion-card" data-prompt="Arrange my week around my priorities and upcoming meetings."><span class="suggestion-icon calendar"><svg class="fluent-icon"><use href="#icon-calendar"></use></svg></span><span>Arrange my week</span></button>
              <button class="suggestion-card" data-prompt="Research Contoso and prepare a concise company brief."><span class="suggestion-icon research"><svg class="fluent-icon"><use href="#icon-search"></use></svg></span><span>Research a company</span></button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="popover model-menu" id="model-menu" role="menu" aria-label="Choose a model" hidden></div>
    <div class="studio-backdrop" id="studio-backdrop" hidden></div>
    <aside class="studio-panel" id="studio-panel" aria-labelledby="studio-title" aria-hidden="true">
      <header>
        <div><span class="eyebrow">Tutorial staging</span><h2 id="studio-title">Demo controls</h2></div>
        <button class="icon-button" id="close-studio" aria-label="Close demo controls"><svg class="fluent-icon"><use href="#icon-dismiss"></use></svg></button>
      </header>
      <div class="studio-body">
        <label>Scene<select id="studio-scene"><option value="home">Cowork home</option><option value="chat">Copilot Chat</option><option value="chat-response">Copilot grounded answer</option><option value="search-results">Copilot Search results</option><option value="workflow-agent">Workflow agent</option><option value="workflow-complete">Completed workflow</option><option value="running">Task in progress</option><option value="approval">Approval request</option><option value="complete">Completed task</option><option value="tasks">My tasks</option><option value="scheduled">Automations</option><option value="customize">Customize</option></select></label>
        <label>Display name<input id="studio-name" value="Elvia Atkins" /></label>
        <label>Task prompt<textarea id="studio-prompt" rows="4">Organize my inbox and draft replies to urgent messages.</textarea></label>
        <label>Model<select id="studio-model"></select></label>
        <label class="switch-row"><span>Show session side panel</span><input id="studio-side-panel" type="checkbox" checked /></label>
        <div class="studio-actions">
          <button class="secondary-button" id="copy-scene-link">Copy scene link</button>
          <button class="primary-button" id="apply-studio">Apply scene</button>
        </div>
        <button class="text-button" id="reset-demo">Reset all demo data</button>
        <p class="studio-hint">Tip: press <kbd>Alt</kbd> + <kbd>D</kbd> to hide or show this panel while recording.</p>
      </div>
    </aside>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
    <script src="./demo-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
