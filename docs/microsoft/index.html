    <div class="window" data-testid="cowork-app">
      <!-- Desktop app title bar -->
      <header class="titlebar" id="titlebar">
        <button class="titlebar-btn mobile-nav" data-action="mobile-nav" aria-label="Open navigation"><svg class="fluent-icon"><use href="#icon-navigation"></use></svg></button>
        <svg class="titlebar-logo" aria-hidden="true"><use href="#copilot-logo"></use></svg>
        <span class="titlebar-title" data-bind="windowTitle"></span>
        <button class="titlebar-search" data-action="titlebar-search"><svg class="fluent-icon"><use href="#icon-search"></use></svg><span data-bind="titlebarSearch"></span></button>
        <div class="titlebar-right">
          <button class="titlebar-btn" data-action="titlebar-more" aria-label="Settings and more"><svg class="fluent-icon"><use href="#icon-more"></use></svg></button>
          <span class="avatar tiny" data-bind="initials"></span>
          <span class="window-controls" aria-hidden="true"><i><svg class="fluent-icon"><use href="#icon-win-min"></use></svg></i><i><svg class="fluent-icon"><use href="#icon-win-max"></use></svg></i><i class="close"><svg class="fluent-icon"><use href="#icon-win-close"></use></svg></i></span>
        </div>
      </header>

      <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Copilot navigation"></aside>
        <div class="sidebar-scrim" data-action="mobile-nav"></div>

        <main class="main-surface" id="main">
          <header class="topbar" id="topbar"></header>
          <section id="workspace" class="workspace"></section>
        </main>
      </div>
    </div>

    <div class="apps-launcher" id="apps-launcher" hidden>
      <header><strong>Microsoft 365</strong><button class="text-button" data-action="all-apps">All apps</button></header>
      <div class="apps-grid">
        <button data-action="launch-app" data-app="Word"><svg class="file-icon lg"><use href="#ft-word"></use></svg><span>Word</span></button>
        <button data-action="launch-app" data-app="Excel"><svg class="file-icon lg"><use href="#ft-excel"></use></svg><span>Excel</span></button>
        <button data-action="launch-app" data-app="PowerPoint"><svg class="file-icon lg"><use href="#ft-powerpoint"></use></svg><span>PowerPoint</span></button>
        <button data-action="launch-app" data-app="Outlook"><svg class="file-icon lg"><use href="#ft-outlook"></use></svg><span>Outlook</span></button>
        <button data-action="launch-app" data-app="Teams"><svg class="file-icon lg"><use href="#ft-teams"></use></svg><span>Teams</span></button>
        <button data-action="launch-app" data-app="OneDrive"><span class="app-tile onedrive"><svg class="fluent-icon"><use href="#icon-cloud"></use></svg></span><span>OneDrive</span></button>
      </div>
    </div>

    <div class="popover model-menu" id="model-menu" role="menu" aria-label="Choose a model" hidden></div>

    <!-- Capture chrome: hidden by ?clean=1 -->
    <div class="capture-chrome" data-mk-chrome>
      <span class="training-badge" data-bind="trainingBadge"></span>
      <button class="studio-launcher" id="open-studio" title="Demo controls (Alt+D)" aria-label="Open demo controls"><svg class="fluent-icon"><use href="#icon-sparkle-circle"></use></svg></button>
    </div>

    <div class="studio-backdrop" id="studio-backdrop" hidden></div>
    <aside class="studio-panel" id="studio-panel" aria-labelledby="studio-title" aria-hidden="true" data-mk-chrome>
      <header>
        <div><span class="eyebrow">Tutorial staging</span><h2 id="studio-title">Demo controls</h2></div>
        <button class="icon-button" id="close-studio" aria-label="Close demo controls"><svg class="fluent-icon"><use href="#icon-dismiss"></use></svg></button>
      </header>
      <div class="studio-body">
        <label>Scene<select id="studio-scene"></select></label>
        <label>Conversation<select id="studio-chat"></select></label>
        <label>Display name<input id="studio-name" /></label>
        <label>Prompt<textarea id="studio-prompt" rows="3"></textarea></label>
        <div class="studio-row">
          <label>Model<select id="studio-model"></select></label>
          <label>Theme<select id="studio-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
        </div>
        <label class="switch-row"><span>Show Cowork task panel</span><input id="studio-side-panel" type="checkbox" checked /></label>
        <div class="studio-actions">
          <button class="secondary-button" id="copy-scene-link">Copy scene link</button>
          <button class="primary-button" id="apply-studio">Apply scene</button>
        </div>
        <div class="studio-actions">
          <button class="secondary-button" id="studio-play" title="Types the prompt into Copilot Chat and streams the reply">Play: type &amp; reply</button>
          <button class="secondary-button" id="studio-edit-data">Edit demo data</button>
        </div>
        <button class="text-button" id="reset-demo">Reset all demo data</button>
        <p class="studio-hint"><kbd>Alt</kbd>+<kbd>D</kbd> demo controls · <kbd>Alt</kbd>+<kbd>E</kbd> data editor · add <code>?clean=1</code> to hide capture chrome.</p>
      </div>
    </aside>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
    <script src="./demo-data.js"></script>
    <script src="../shared/mockkit.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
