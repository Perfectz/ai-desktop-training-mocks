<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Editable Claude Desktop training mock using fictional demo data." />
  <title>Claude Desktop — Training Mock</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M13 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-7M17.5 3.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-recents" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-artifact" viewBox="0 0 24 24"><path d="M12 3 4 8v8l8 5 8-5V8zM4 8l8 5 8-5m-8 5v8"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3m8-6 4 3-4 3m-2-9-4 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M8 14v6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m5 12 14-8-5 16-3-6zM11 14l8-10"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v3"/></symbol>
    <symbol id="i-document" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v5h5M9 12h6m-6 4h6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 21h14"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4m-6.8 7 6.8 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-claude" viewBox="0 0 24 24"><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5M4.6 4.6l3.6 3.6M15.8 15.8l3.6 3.6M19.4 4.6l-3.6 3.6M8.2 15.8l-3.6 3.6M7.3 2.5l1.9 4.7M14.8 16.8l1.9 4.7M2.5 16.7l4.7-1.9M16.8 9.2l4.7-1.9"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.4a1.8 1.8 0 0 0 1.2-3.1l-.5-.4a1.7 1.7 0 0 1 1.1-3h2.3A3.5 3.5 0 0 0 21 11 9 9 0 0 0 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.8" r="1"/><circle cx="14.2" cy="6.8" r="1"/><circle cx="17" cy="10" r="1"/></symbol>
    <symbol id="i-slides" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22l4-4 4 4M7 9h5M7 13h3m4-4h3v4h-3z"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Claude navigation">
      <header class="sidebar-header"><button class="brand" data-action="home"><span class="claude-mark"><svg class="claude-symbol"><use href="#i-claude"/></svg></span><strong>Claude</strong></button><button class="icon-button" data-action="collapse" aria-label="Collapse sidebar"><svg><use href="#i-panel"/></svg></button></header>
      <div class="surface-toggle" role="tablist"><button class="active" data-surface="claude" role="tab">Claude</button><button data-surface="code" role="tab">Code</button></div>
      <nav class="primary-nav">
        <button class="nav-row active" data-action="new"><svg><use href="#i-compose"/></svg><span>New chat</span></button>
        <button class="nav-row" data-action="search"><svg><use href="#i-search"/></svg><span>Search</span></button>
        <button class="nav-row" data-action="recents"><svg><use href="#i-recents"/></svg><span>Recents</span></button>
        <button class="nav-row" data-action="artifacts"><svg><use href="#i-artifact"/></svg><span>Artifacts</span></button>
        <button class="nav-row" data-action="scheduled"><svg><use href="#i-calendar"/></svg><span>Scheduled</span></button>
      </nav>
      <div class="sidebar-scroll"><section><header><span>Projects</span><button data-action="new-project"><svg><use href="#i-plus"/></svg></button></header><div id="projects-list"></div></section><section><header><span>Recents</span><button><svg><use href="#i-more"/></svg></button></header><div id="recents-list"></div></section></div>
      <button class="account-row" data-action="account"><span class="avatar">EA</span><span><strong>Elvia Atkins</strong><small>Claude Pro</small></span><svg><use href="#i-more"/></svg></button>
    </aside>
    <main class="main-area"><header class="topbar"><button class="model-picker" data-action="model">Claude Opus 4.8 <svg><use href="#i-chevron"/></svg></button><div class="topbar-spacer"></div><span class="mock-badge">TRAINING MOCK · FICTIONAL DATA</span><button class="icon-button" data-action="share"><svg><use href="#i-share"/></svg></button><button class="icon-button"><svg><use href="#i-more"/></svg></button></header><section id="workspace" class="workspace"></section></main>
  </div>

  <div class="search-overlay" id="search-overlay" hidden><div class="search-dialog"><header><svg><use href="#i-search"/></svg><input id="search-input" placeholder="Search conversations and projects"/><button data-action="close-search"><svg><use href="#i-close"/></svg></button></header><div id="search-results"></div></div></div>
  <div class="plus-menu" id="plus-menu" hidden><button data-add="files"><svg><use href="#i-document"/></svg><span><strong>Add files</strong><small>PDFs, documents, and images</small></span></button><button data-add="research"><svg><use href="#i-globe"/></svg><span><strong>Research</strong><small>Search and synthesize sources</small></span></button><button data-add="project"><svg><use href="#i-folder"/></svg><span><strong>Add project context</strong><small>Use files and instructions</small></span></button></div>
  <div class="output-menu" id="output-menu" hidden><header><strong>Create an output</strong><small>Choose how Claude should present the work</small></header><button data-output="design"><svg><use href="#i-palette"/></svg><span><strong>Design</strong><small>Visual layouts and polished concepts</small></span></button><button data-output="slides"><svg><use href="#i-slides"/></svg><span><strong>Slides</strong><small>A presentation you can revise</small></span></button><button data-output="docs"><svg><use href="#i-document"/></svg><span><strong>Docs</strong><small>A structured document or report</small></span></button><button data-output="artifact"><svg><use href="#i-artifact"/></svg><span><strong>Artifact</strong><small>An interactive tool beside the chat</small></span></button></div>

  <button class="studio-launch" id="open-studio" title="Tutorial controls (Alt+D)"><svg class="claude-symbol"><use href="#i-claude"/></svg></button><div class="studio-backdrop" id="studio-backdrop" hidden></div><aside class="studio" id="studio" aria-hidden="true"><header><div><span>Tutorial staging</span><h2>Claude mock controls</h2></div><button data-action="close-studio"><svg><use href="#i-close"/></svg></button></header><div class="studio-body"><label>Scene<select id="studio-scene"></select></label><label>Display name<input id="studio-name"/></label><label>Prompt<textarea id="studio-prompt" rows="4"></textarea></label><label>Model<select id="studio-model"></select></label><label class="toggle-row"><span>Permission mode</span><select id="studio-permission"><option>Manual</option><option>Auto</option></select></label><div class="studio-actions"><button class="secondary" data-action="copy-link">Copy scene link</button><button class="primary" data-action="apply-studio">Apply scene</button></div><button class="reset-link" data-action="reset">Reset fake data</button><p>Press <kbd>Alt</kbd> + <kbd>D</kbd> to show or hide controls while recording.</p></div></aside><div class="toast" id="toast" role="status"></div>
  <script src="./demo-data.js"></script><script src="./app.js"></script>
</body>
</html>
