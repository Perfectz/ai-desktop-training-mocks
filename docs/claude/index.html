  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Claude navigation"></aside>
    <div class="scrim" data-action="close-sidebar"></div>
    <main class="main" id="main">
      <header class="topbar" id="topbar"></header>
      <div class="stage" id="stage"></div>
    </main>
    <aside class="side-panel" id="side-panel" hidden></aside>
  </div>

  <div class="popover" id="popover" hidden></div>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-dialog" role="dialog" aria-label="Search chats">
      <header><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search-input" autocomplete="off" /><button class="icon-btn" data-action="close-search" aria-label="Close search"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- Tutorial studio (Alt+D) -->
  <button class="studio-launcher" id="open-studio" title="Tutorial controls (Alt+D)" aria-label="Open tutorial controls"><svg aria-hidden="true"><use href="#i-spark"/></svg></button>
  <div class="studio-backdrop" id="studio-backdrop" data-mk-chrome hidden></div>
  <aside class="studio" id="studio" aria-hidden="true" data-mk-chrome>
    <header><div><span>Tutorial staging</span><h2>Claude mock controls</h2></div><button class="icon-btn" data-action="close-studio" aria-label="Close controls"><svg aria-hidden="true"><use href="#i-close"/></svg></button></header>
    <div class="studio-body">
      <label>Scene<select id="studio-scene"></select></label>
      <label>Open conversation<select id="studio-chat"></select></label>
      <label>Display name<input id="studio-name" /></label>
      <label>Composer text<textarea id="studio-prompt" rows="3"></textarea></label>
      <div class="studio-grid">
        <label>Model<select id="studio-model"></select></label>
        <label>Permission<select id="studio-permission"><option value="Manual">Manual</option><option value="Auto">Auto</option></select></label>
      </div>
      <label>Theme<select id="studio-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <div class="studio-actions"><button class="secondary" data-action="copy-link">Copy scene link</button><button class="primary" data-action="apply-studio">Apply scene</button></div>
      <button class="secondary wide" data-action="edit-data">Edit demo data</button>
      <button class="reset-link" data-action="reset">Reset fake data</button>
      <p>Press <kbd>Alt</kbd> + <kbd>D</kbd> for these controls and <kbd>Alt</kbd> + <kbd>E</kbd> for the data editor. Add <code>?clean=1</code> to hide recording chrome.</p>
    </div>
  </aside>
  <div class="toast" id="toast" role="status"></div>

  <script src="./demo-data.js"></script>
  <script src="../shared/mockkit.js"></script>
  <script src="./app.js"></script>
</body>
</html>
